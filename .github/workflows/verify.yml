name: Browser regression tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  xss-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable SQL Server and web lab
        run: |
          printf 'MSSQL_SA_PASSWORD=LabA!%s\n' "$(openssl rand -hex 24)" > .env
          docker compose up --build -d
          curl --fail --silent --show-error --retry 90 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/ > /dev/null
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Remove containers and test data
        if: always()
        run: docker compose down --volumes --remove-orphans
